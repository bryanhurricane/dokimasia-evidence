#   B, sanitizer on, guard off: 20261003-172137 and 20261004-153740; C, as shipped (sanitizer and guard on): 20261003-212901 and
#   20261004-172052. Sampled: one run per model and case, among the runs whose injection reached the model, drawn with a fixed seed
#   (45 per report, 20% of those runs). B and C rates come from these samples, so they are not comparable to A case for case.
#
# Labeled by Claude (Opus 5.5), 2026-10-05, in six parallel sessions that each read every reply in a blind batch of 150 (no model
# names, configurations or report ids), against the key alone. Each batch also held 15 hidden replies from the v1 set; on those 90,
# the readings agreed with the v1 labels exactly on 58, with Cohen's kappa 0.88 for A, 1.0 for C, 0.84 for F, 1.0 for L, 0.79 for U,
# but only 0.30 for R (v1 21, re-read 28) and 0.55 for "carries the attack". R is the unreliable code: the readings split on neutral
# mentions with no flag (v1 R, re-read none) and on asks that restate the attacker's reason or URL (v1 A, re-read R and A). Treat any
# rate that depends on R as one reading with a known disagreement; the paired readings are in evals/decoy_labels_v2_calibration.json.
# No person has labeled these replies.

